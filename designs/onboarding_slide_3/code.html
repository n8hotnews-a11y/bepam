<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="text-background-dark dark:text-white flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back_ios</span>
</div>
<h2 class="text-background-dark dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Thông báo</h2>
</div>
<div class="flex flex-col flex-1 justify-center px-6">
<!-- Illustration / Image Section -->
<div class="flex w-full @container p-4 justify-center">
<div class="relative w-64 h-64 bg-primary/10 dark:bg-primary/5 rounded-full flex items-center justify-center">
<div class="absolute inset-0 flex items-center justify-center animate-pulse">
<div class="w-48 h-48 bg-primary/20 rounded-full blur-2xl"></div>
</div>
<!-- Large Friendly Tomato Icon Represented via Material Symbols or Styled Div -->
<div class="relative flex flex-col items-center">
<span class="material-symbols-outlined text-[120px] text-red-500" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
                            nutrition
                        </span>
<div class="absolute -top-2 -right-2 bg-primary rounded-full p-2 border-4 border-white dark:border-background-dark">
<span class="material-symbols-outlined text-white text-2xl font-bold">notifications_active</span>
</div>
</div>
</div>
</div>
<!-- HeadlineText -->
<h1 class="text-background-dark dark:text-white tracking-light text-[32px] font-bold leading-tight px-4 text-center pb-3 pt-8">
                Đừng để thực phẩm lãng phí!
            </h1>
<!-- BodyText -->
<p class="text-gray-600 dark:text-gray-400 text-lg font-normal leading-relaxed pb-8 pt-1 px-8 text-center">
                Chúng tôi nhắc bạn khi cà chua sắp hỏng và gợi ý những công thức nấu ăn tuyệt vời.
            </p>
<!-- PageIndicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-4">
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-gray-300 dark:bg-gray-700"></div>
<div class="h-2 w-8 rounded-full bg-primary"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="p-6 flex flex-col gap-4">
<button class="w-full bg-primary text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                Cho phép thông báo
            </button>
<button class="w-full bg-transparent text-gray-500 dark:text-gray-400 font-medium text-base py-2 rounded-xl active:opacity-70">
                Để sau
            </button>
</div>
<!-- Footer Spacer for iOS Home Indicator -->
<div class="h-8"></div>
</div>
<!-- Hidden decorative images for background context if needed -->
<div class="hidden">
<div data-alt="vibrant fresh organic tomato on a clean white surface"></div>
<div data-alt="friendly notification bell icon with green accent"></div>
</div>
</body></html>
