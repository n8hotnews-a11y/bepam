<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tủ lạnh - Trống</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-[#111813] dark:text-white font-display flex flex-col overflow-hidden">
<div class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="flex items-center gap-2">
<div class="text-primary material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">kitchen</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-tight">Tủ lạnh của bạn</h2>
</div>
<div class="flex items-center">
<button class="relative flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#111813] dark:text-white">notifications</span>
</button>
</div>
</div>
</div>
<main class="flex-1 flex flex-col justify-center items-center max-w-md mx-auto w-full px-6 pb-20">
<div class="w-full">
<div class="bg-white dark:bg-gray-900 rounded-[2.5rem] p-8 shadow-sm border border-gray-50 dark:border-gray-800 text-center">
<div class="mb-6 relative inline-block">
<div class="w-24 h-24 bg-gray-50 dark:bg-gray-800 rounded-full flex items-center justify-center mx-auto">
<span class="material-symbols-outlined text-5xl text-gray-300 dark:text-gray-700">kitchen</span>
</div>
<div class="absolute bottom-0 right-0 bg-white dark:bg-gray-900 p-2 rounded-full shadow-md">
<span class="material-symbols-outlined text-2xl text-orange-400">sentiment_dissatisfied</span>
</div>
</div>
<h3 class="text-xl font-bold text-[#111813] dark:text-white mb-2">Tủ lạnh đang trống!</h3>
<p class="text-gray-500 dark:text-gray-400 text-sm mb-8 px-4 leading-relaxed">Hãy bắt đầu thêm thực phẩm để chúng tôi có thể gợi ý những món ngon dành riêng cho bạn.</p>
<div class="space-y-3">
<button class="w-full flex items-center justify-center gap-3 p-4 bg-primary hover:bg-primary/90 transition-colors rounded-2xl shadow-sm shadow-primary/20">
<span class="material-symbols-outlined text-xl text-black">edit_note</span>
<span class="text-sm font-bold text-black">Thêm thủ công</span>
</button>
<button class="w-full flex items-center justify-center gap-3 p-4 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors rounded-2xl border border-gray-200 dark:border-gray-700">
<span class="material-symbols-outlined text-xl text-blue-500">document_scanner</span>
<span class="text-sm font-bold text-[#111813] dark:text-white">Quét hóa đơn</span>
</button>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-background-dark/95 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800 pb-8 pt-2 z-50">
<div class="flex justify-around items-center max-w-md mx-auto px-4">
<button class="flex flex-col items-center gap-1 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">kitchen</span>
<span class="text-[10px] font-bold">Tủ lạnh</span>
</button>
<button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="text-[10px] font-medium">Mua sắm</span>
</button>
<button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">menu_book</span>
<span class="text-[10px] font-medium">Công thức</span>
</button>
<button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium">Cá nhân</span>
</button>
</div>
</div>

</body></html>
