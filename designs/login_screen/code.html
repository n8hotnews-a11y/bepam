<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng nhập - Smart Kitchen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "fresh-green": "#2ECC71",
                        "soft-bg": "#F9FAFB",
                        "border-light": "#E5E7EB",
                    },
                    fontFamily: {
                        "sans": ["'Plus Jakarta Sans'", "sans-serif"]
                    },
                    borderRadius: {
                        "custom": "16px",
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans antialiased text-slate-900 bg-soft-bg;
            }
        }
        .floating-label-group {
            position: relative;
        }
        .floating-label-group input:focus ~ label,
        .floating-label-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);
            color: #2ECC71;
            background-color: white;
            padding: 0 4px;
        }
        .floating-label-group label {
            position: absolute;
            left: 16px;
            top: 16px;
            transition: all 0.2s ease;
            pointer-events: none;
            color: #6B7280;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center">
<div class="w-full max-w-[400px] min-h-screen bg-white shadow-sm flex flex-col relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-48 opacity-10 pointer-events-none">
<img alt="Fresh vegetables background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-giIJipNUNPSpj--1sBsPm-d9_xsTYWFxUBo_6GxHVygbSN797VKXjizxzHLQl8peSB_WE4tgNgXZbsg2s9-A3K-naPHe9YnvHtS6qfQT99LbNl-Hqe9AF-xxxBYvhgneseSeZmVTvHaP2IM-TFxEX3eSrQhXujmfnpWYSu1NyT3N-mOtU12nBErutTG1HURrVNim3Ci3Oyel_Nxe08-pURk547QpGbeld5HZKBIMDruYvqBoYPeZJaMOubc-Ke2we6KFR3Kc4g"/>
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-white"></div>
</div>
<div class="relative z-10 flex flex-col flex-1 px-8 pt-20">
<div class="flex flex-col items-center mb-12">
<div class="w-16 h-16 bg-fresh-green/10 rounded-custom flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-fresh-green text-4xl" style="font-variation-settings: 'FILL' 1;">kitchen</span>
</div>
<h1 class="text-2xl font-bold tracking-tight text-center text-slate-800">Mừng bạn trở lại</h1>
<p class="text-slate-500 text-sm mt-2 text-center font-medium">Quản lý thực phẩm thông minh &amp; bền vững</p>
</div>
<div class="space-y-6">
<div class="floating-label-group">
<input class="block w-full h-14 px-4 text-slate-800 bg-white border border-border-light rounded-custom focus:ring-1 focus:ring-fresh-green focus:border-fresh-green outline-none transition-all duration-200" id="email" placeholder=" " type="text"/>
<label class="text-base" for="email">Email hoặc Số điện thoại</label>
</div>
<div class="floating-label-group relative">
<input class="block w-full h-14 px-4 text-slate-800 bg-white border border-border-light rounded-custom focus:ring-1 focus:ring-fresh-green focus:border-fresh-green outline-none transition-all duration-200" id="password" placeholder=" " type="password"/>
<label class="text-base" for="password">Mật khẩu</label>
<button class="absolute right-4 top-4 text-slate-400">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-xs font-semibold text-slate-400 hover:text-fresh-green transition-colors" href="#">Quên mật khẩu?</a>
</div>
<button class="w-full bg-fresh-green text-white font-bold text-base h-14 rounded-custom shadow-lg shadow-fresh-green/20 hover:bg-[#27AE60] active:scale-[0.98] transition-all duration-200">
                    Đăng nhập
                </button>
</div>
<div class="mt-12">
<div class="relative flex items-center justify-center mb-8">

</button>
<button class="flex items-center justify-center h-14 rounded-custom border border-border-light hover:bg-slate-50 transition-colors">
<span class="material-symbols-outlined text-black text-2xl" style="font-variation-settings: 'FILL' 1;">ios</span>
</button>
<button class="flex items-center justify-center h-14 rounded-custom border border-border-light hover:bg-slate-50 transition-colors">
<svg class="w-6 h-6 text-[#1877F2]" fill="currentColor" viewBox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
</button>
</div>
</div>
<div class="mt-auto pb-10 text-center">
<p class="text-slate-500 text-sm">
                    Chưa có tài khoản? 
                    <a class="text-fresh-green font-bold ml-1 hover:underline" href="#">Đăng ký ngay</a>
</p>
</div>
</div>
</div>

</body></html>
