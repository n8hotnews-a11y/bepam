<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#111813] dark:text-white transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-[430px] mx-auto bg-white dark:bg-background-dark shadow-2xl">

<div class="flex items-center p-4 justify-end">
<button class="flex items-center justify-end">
<p class="text-[#61896f] dark:text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0">Bỏ qua</p>
</button>
</div>
<!-- Main Content Area -->
<div class="flex flex-col flex-grow items-center justify-center px-6">
<!-- Hero Illustration Placeholder -->
<div class="w-full aspect-[4/5] relative rounded-3xl overflow-hidden mb-8 bg-primary/10 dark:bg-primary/5 flex items-center justify-center">
<!-- Illustration Concept: Happy person with organized fridge -->
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Happy person standing next to a modern organized refrigerator with fresh food" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDgNzmXPBVccxsnXGz2Tv60FF1OadeY6t2nb_gPwDq0Y06m1FYUpvHHHjmy4ybH7qnCS-NMx5yq7dnye5RRc-P5Z1bBHsWivfB40Bql-1at4XF-qVmM_smV2gXBqqEN26VM3MFRFFtSy8yT-x96LV1T6gGs0N1tn_CDg_Hw5dWUFZfMZkAGxFs1QnGTe8OPKuQmQmXKZ_oPqq_f6xaBAwjiqfYPeaj108d45EuMO3HfTVJZ7BXKBqKnEkLdzTiDl2EFgy2-LDDzKw");'>
</div>
<!-- Overlay Gradient for Depth -->
<div class="absolute inset-0 bg-gradient-to-t from-white/20 to-transparent"></div>
</div>
<!-- Headline -->
<h2 class="text-[#111813] dark:text-white tracking-tight text-[26px] font-bold leading-tight text-center mb-3 px-2">
                App giúp bạn không bao giờ phải vứt đồ hỏng
            </h2>
<!-- Body Text -->
<p class="text-[#4e6354] dark:text-gray-300 text-base font-normal leading-relaxed text-center px-4">
                Và trả lời 'Hôm nay ăn gì?' - Quản lý thực phẩm thông minh &amp; gợi ý món ăn mỗi ngày.
            </p>
</div>
<!-- Footer Area -->
<div class="px-6 pb-12 pt-4">
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 mb-8">
<div class="h-2 w-6 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-[#dbe6df] dark:bg-gray-700"></div>
<div class="h-2 w-2 rounded-full bg-[#dbe6df] dark:bg-gray-700"></div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:opacity-90 text-[#111813] font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-primary/20">
<span class="text-lg">Tiếp tục</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Safe Area Decor (for iOS feel) -->
<div class="h-2 w-32 bg-gray-200 dark:bg-gray-800 mx-auto mb-2 rounded-full"></div>
</div>
