<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registration Screen - Smart Kitchen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22C55E", // Fresh Green
                        "surface": "#F9FAFB",
                    },
                    fontFamily: {
                        "sans": ["'Plus Jakarta Sans'", "sans-serif"]
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-white text-[#1A1C1E] antialiased;
                font-family: 'Plus Jakarta Sans', sans-serif;
            }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-checkbox {
            @apply appearance-none w-5 h-5 bg-[#F3F4F6] border border-gray-200 rounded-lg transition-all relative cursor-pointer checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0;
        }
        .custom-checkbox:checked::after {
            content: '\e5ca';
            font-family: 'Material Symbols Outlined';
            @apply absolute inset-0 flex items-center justify-center text-white text-[16px] font-bold;
        }
    </style>
<style>
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex items-center justify-center bg-gray-50/50">
<div class="flex flex-col w-full max-w-[430px] min-h-screen bg-white shadow-2xl shadow-gray-200/50 overflow-hidden relative">
<div class="flex items-center px-4 pt-12 pb-2">
<button class="flex items-center justify-center size-12 rounded-full hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined text-gray-900 !text-[24px]">chevron_left</span>
</button>
</div>
<div class="px-8 pt-4 pb-8">
<h1 class="text-[#1A1C1E] text-[32px] font-light tracking-tight leading-[1.15]">
                Bắt đầu <br/><span class="font-bold">hành trình xanh</span>
</h1>
<p class="text-gray-500 text-[15px] mt-4 leading-relaxed max-w-[280px]">
                Quản lý tủ lạnh thông minh, giảm lãng phí thực phẩm cùng cộng đồng.
            </p>
</div>
<div class="flex-1 px-8 space-y-4">
<div class="space-y-2">
<label class="text-[14px] font-semibold text-gray-700 ml-1">Họ và tên</label>
<input class="w-full bg-[#F3F4F6] border-none rounded-[16px] px-4 py-4 text-[15px] focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-gray-400 font-medium" placeholder="Nguyễn Văn A" type="text"/>
</div>
<div class="space-y-2">
<label class="text-[14px] font-semibold text-gray-700 ml-1">Email hoặc Số điện thoại</label>
<input class="w-full bg-[#F3F4F6] border-none rounded-[16px] px-4 py-4 text-[15px] focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-gray-400 font-medium" placeholder="example@email.com" type="text"/>
</div>
<div class="space-y-2">
<label class="text-[14px] font-semibold text-gray-700 ml-1">Mật khẩu</label>
<div class="relative">
<input class="w-full bg-[#F3F4F6] border-none rounded-[16px] px-4 py-4 text-[15px] focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-gray-400 font-medium pr-12" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
<span class="material-symbols-outlined !text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="text-[14px] font-semibold text-gray-700 ml-1">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full bg-[#F3F4F6] border-none rounded-[16px] px-4 py-4 text-[15px] focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-gray-400 font-medium pr-12" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
<span class="material-symbols-outlined !text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 pt-4">
<input class="custom-checkbox mt-0.5" id="terms" type="checkbox"/>
<label class="text-[13px] text-gray-500 leading-tight font-medium" for="terms">
                    Tôi đồng ý với <a class="text-primary font-bold hover:underline" href="#">Điều khoản</a> &amp; <a class="text-primary font-bold hover:underline" href="#">Chính sách bảo mật</a> của ứng dụng.
                </label>
</div>
</div>
<div class="p-8 mt-auto">
<button class="w-full bg-primary text-white py-4.5 h-[60px] rounded-[20px] font-bold text-[17px] shadow-lg shadow-green-100 active:scale-[0.98] transition-all flex items-center justify-center">
                Đăng ký
            </button>
<p class="text-center mt-6 text-[15px] text-gray-500 font-medium">
                Đã có tài khoản? 
                <a class="text-primary font-bold ml-1 hover:underline" href="#">Đăng nhập</a>
</p>
<div class="w-32 h-1.5 bg-gray-100 mx-auto mt-8 rounded-full"></div>
</div>
<div class="absolute -top-24 -right-24 w-64 h-64 bg-green-50 rounded-full blur-3xl opacity-40 -z-10"></div>
<div class="absolute top-1/3 -left-24 w-48 h-48 bg-gray-50 rounded-full blur-3xl opacity-40 -z-10"></div>
</div>

</body></html>
