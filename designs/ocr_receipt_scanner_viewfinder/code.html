<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OCR Receipt Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #13ec5b, transparent);
            box-shadow: 0 0 15px #13ec5b;
            position: absolute;
            width: 100%;
            top: 20%;
            /* Simple CSS animation simulated via placement or static for this UI output as requested "no animation in CSS" */
        }
        .viewfinder-mask {
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-screen w-full flex-col overflow-hidden bg-black">
<!-- Live Camera Background Placeholder -->
<div class="absolute inset-0 z-0">
<img alt="A grocery receipt placed on a modern kitchen countertop" class="h-full w-full object-cover opacity-80" data-alt="Grocery receipt on a kitchen counter for scanning" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCa7rICrY0-CA7nxy0ECs2X66BFRVwQbyD6HDri1xV7cUEvRPw8uEcdlmLfYY98rRjE5hx0KpJ1tKvKlyYtA9cPo526UTvPO-VrlH9ck6zy6sgAY8k-_tslnJ8JIAXiTUMGz7_neLlkr1mq03i-pNR9peYDR_ZoV9PSNtjzUle0BsyUE8NnucS4m4vFhJOC8XS4jHDhnaj7KwQdOMhkIGVVmHlpH94GKL7w3Ygxk9lF3lAB6yN-CWQ1DHIyub3MfC3OiDLRv2Piw"/>
</div>
<!-- Viewfinder Overlay Layer -->
<div class="absolute inset-0 z-10 flex flex-col pointer-events-none">
<!-- Top Mask -->
<div class="h-1/4 w-full viewfinder-mask"></div>
<div class="flex h-1/2 w-full">
<!-- Left Mask -->
<div class="w-10 h-full viewfinder-mask"></div>
<!-- Scanning Frame -->
<div class="relative flex-1 border-2 border-primary/30 rounded-xl overflow-hidden">
<!-- Corner Brackets -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-lg"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-lg"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-lg"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-lg"></div>
<!-- Scanning Line -->
<div class="scan-line top-1/4"></div>
</div>
<!-- Right Mask -->
<div class="w-10 h-full viewfinder-mask"></div>
</div>
<!-- Bottom Mask -->
<div class="flex-1 w-full viewfinder-mask"></div>
</div>
<!-- Top AppBar UI -->
<div class="relative z-20 flex items-center justify-between p-4 pt-12">
<button class="flex size-10 items-center justify-center rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="flex gap-2">
<button class="flex size-10 items-center justify-center rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">flash_on</span>
</button>
<button class="flex size-10 items-center justify-center rounded-full bg-black/20 backdrop-blur-md text-white">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Meta Text Tooltip -->
<div class="relative z-20 flex justify-center px-4 mt-4">
<div class="bg-black/40 backdrop-blur-lg px-6 py-2 rounded-full border border-white/10">
<p class="text-white text-sm font-medium leading-normal text-center">
                    Align your receipt within the frame for best results
                </p>
</div>
</div>
<!-- Spacer for centering -->
<div class="flex-1"></div>
<!-- Bottom Controls -->
<div class="relative z-20 pb-12 pt-6 bg-gradient-to-t from-black/80 to-transparent">
<div class="flex items-center justify-center gap-10 px-8">
<!-- Gallery Upload -->
<div class="flex flex-col items-center gap-2">
<button class="flex size-12 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined">image</span>
</button>
<span class="text-[10px] text-white/70 font-semibold uppercase tracking-wider">Gallery</span>
</div>
<!-- Main Capture Button -->
<button class="flex size-20 items-center justify-center rounded-full bg-primary text-black shadow-lg shadow-primary/20 hover:scale-105 transition-transform">
<div class="size-16 rounded-full border-4 border-black/10 flex items-center justify-center">
<span class="material-symbols-outlined !text-4xl">receipt_long</span>
</div>
</button>
<!-- History/Spiral placeholder as per component -->
<div class="flex flex-col items-center gap-2">
<button class="flex size-12 items-center justify-center rounded-full bg-white/10 backdrop-blur-md text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined">history</span>
</button>
<span class="text-[10px] text-white/70 font-semibold uppercase tracking-wider">Recent</span>
</div>
</div>
<!-- iOS Home Indicator Safe Area Padding -->
<div class="h-4"></div>
</div>
</div>
</body></html>
