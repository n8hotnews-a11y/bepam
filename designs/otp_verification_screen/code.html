<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OTP Verification - Smart Kitchen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for the OTP inputs to hide spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<div class="flex items-center bg-transparent p-4 justify-between">
<button class="text-slate-800 dark:text-slate-200 flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<div class="w-12"></div> <!-- Spacer for balance -->
</div>
<main class="flex-grow flex flex-col px-6 max-w-md mx-auto w-full">
<!-- Illustration Section -->
<div class="flex flex-col items-center justify-center py-8">
<div class="relative w-32 h-32 bg-primary/10 dark:bg-primary/5 rounded-full flex items-center justify-center">
<div class="absolute -top-1 -right-1 bg-white dark:bg-background-dark p-2 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800">
<span class="material-symbols-outlined text-primary text-3xl">sms</span>
</div>
<span class="material-symbols-outlined text-primary text-6xl" style="font-variation-settings: 'FILL' 1">smartphone</span>
</div>
</div>
<!-- Heading & Subheading -->
<div class="text-center mb-8">
<h1 class="text-[#111813] dark:text-white tracking-tight text-2xl font-bold leading-tight mb-3">
                Xác thực mã OTP
            </h1>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-relaxed">
                Vui lòng nhập mã OTP gồm 6 chữ số đã được gửi đến số điện thoại <span class="font-semibold text-slate-800 dark:text-slate-200">+84 123***789</span>
</p>
</div>
<!-- Confirmation Code Inputs -->
<div class="flex justify-center mb-6">
<fieldset class="flex gap-2 sm:gap-3">
<input autofocus="" class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
<input class="flex h-14 w-11 sm:w-12 text-center text-xl font-bold rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary dark:text-white outline-none transition-all" max="9" maxlength="1" type="number"/>
</fieldset>
</div>
<!-- Timer & Resend Link -->
<div class="flex flex-col items-center gap-2 mb-10">
<div class="flex items-center gap-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-lg">timer</span>
<span class="text-sm font-medium tabular-nums">01:59</span>
</div>
<button class="text-slate-400 dark:text-slate-600 text-sm font-semibold cursor-not-allowed hover:text-primary transition-colors" disabled="">
                Gửi lại mã
            </button>
</div>
<!-- Bottom Action Button -->
<div class="mt-auto pb-8">
<button class="w-full bg-primary hover:bg-primary/90 text-slate-900 text-base font-bold h-14 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Xác nhận
            </button>
</div>
</main>
<!-- App Decorative Footer -->
<div class="h-1.5 w-32 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-2"></div>
</body></html>
