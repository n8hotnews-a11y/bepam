<!DOCTYPE html>
<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Compact Home Screen Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style type="text/tailwindcss">
        body {
          min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark h-screen flex flex-col text-[#111813] dark:text-white font-display overflow-hidden">
<header class="shrink-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center px-4 py-2 justify-between max-w-md mx-auto">
<div class="flex items-center gap-2">
<div class="text-primary material-symbols-outlined text-2xl">kitchen</div>
<h2 class="text-[#111813] dark:text-white text-lg font-bold tracking-tight">Tủ lạnh</h2>
</div>
<div class="flex items-center">
<button class="relative flex items-center justify-center p-1.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#111813] dark:text-white text-xl">notifications</span>
<span class="absolute top-1.5 right-1.5 flex h-2 w-2 rounded-full bg-red-500"></span>
</button>
</div>
</div>
</header>
<main class="flex-1 overflow-y-auto max-w-md mx-auto w-full">
<section class="px-4 pt-3">
<div class="flex items-center justify-between mb-2">
<h3 class="text-[#111813] dark:text-white text-xs font-bold uppercase tracking-tight">Sắp hết hạn</h3>
<span class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Tất cả</span>
</div>
<div class="space-y-1.5">
<div class="flex items-center gap-2.5 bg-white dark:bg-gray-900 rounded-lg p-2 shadow-sm border border-gray-50 dark:border-gray-800">
<div class="text-red-500 flex items-center justify-center rounded-md bg-red-50 dark:bg-red-900/20 shrink-0 size-8">
<span class="material-symbols-outlined text-base">restaurant</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-0.5">
<p class="text-[#111813] dark:text-white text-xs font-semibold truncate">Thịt bò thăn</p>
<span class="text-red-500 text-[9px] font-bold bg-red-50 dark:bg-red-900/30 px-1.5 py-0.5 rounded">Hôm nay</span>
</div>
<div class="flex items-center gap-2">
<div class="flex-1 h-1 rounded-full bg-gray-100 dark:bg-gray-800 overflow-hidden">
<div class="h-full bg-red-500 rounded-full" style="width: 5%;"></div>
</div>
<p class="text-gray-400 dark:text-gray-500 text-[9px] font-medium">10%</p>
</div>
</div>
</div>
<div class="flex items-center gap-2.5 bg-white dark:bg-gray-900 rounded-lg p-2 shadow-sm border border-gray-50 dark:border-gray-800">
<div class="text-orange-500 flex items-center justify-center rounded-md bg-orange-50 dark:bg-orange-900/20 shrink-0 size-8">
<span class="material-symbols-outlined text-base">water_drop</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex justify-between items-center mb-0.5">
<p class="text-[#111813] dark:text-white text-xs font-semibold truncate">Sữa tươi TH</p>
<span class="text-orange-500 text-[9px] font-bold bg-orange-50 dark:bg-orange-900/30 px-1.5 py-0.5 rounded">3 ngày</span>
</div>
<div class="flex items-center gap-2">
<div class="flex-1 h-1 rounded-full bg-gray-100 dark:bg-gray-800 overflow-hidden">
<div class="h-full bg-orange-400 rounded-full" style="width: 40%;"></div>
</div>
<p class="text-gray-400 dark:text-gray-500 text-[9px] font-medium">40%</p>
</div>
</div>
</div>
</div>
</section>
<section class="px-4 mt-4">
<div class="flex items-center justify-between mb-2">
<h3 class="text-[#111813] dark:text-white text-xs font-bold uppercase tracking-tight">Gợi ý cho bạn</h3>
<span class="text-[10px] font-semibold text-primary uppercase tracking-wider">Tối ưu</span>
</div>
<div class="flex gap-2.5 overflow-x-auto pb-2 hide-scrollbar snap-x">
<div class="snap-start shrink-0 w-48 bg-white dark:bg-gray-900 rounded-lg overflow-hidden shadow-sm border border-gray-100 dark:border-gray-800">
<div class="relative h-24 w-full">
<img alt="Phở xào thịt bò" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuARDlPn-JqSGglh3oyP9tWlwLa3U6eiKizPbn9xM0d-ShfhwJ0WDhggtzi-bxTQRQlNG8dQotxKhTp_MhzdwpQqMon-EV6DDdeR8tbOlCiFetObNjKeaOKfXhhwnq6NttUlV-wRKEtSlLKQXgccjknVS4XCAcvjw5QkY8dhV1dobAB1dU0wvwrV6yYc9qXYiHhZ2Zi8Z5hyx0i0wPWSO2EapXY6vd1P3QvSrqIO8cLB4DzfzV2_ggsFH7oYfiEPMqkL6Y6eP20bmw"/>
<div class="absolute bottom-1.5 right-1.5">
<span class="bg-black/60 backdrop-blur-md text-white text-[8px] font-bold px-1 py-0.5 rounded uppercase flex items-center gap-0.5">
<span class="material-symbols-outlined text-[10px]">timer</span> 20'
                        </span>
</div>
</div>
<div class="p-2">
<h4 class="text-[11px] font-bold text-[#111813] dark:text-white mb-1 truncate leading-tight">Phở xào bò</h4>
<button class="w-full bg-primary text-black text-[10px] font-bold py-1.5 rounded flex items-center justify-center">
                        Xem chi tiết
                    </button>
</div>
</div>
<div class="snap-start shrink-0 w-48 bg-white dark:bg-gray-900 rounded-lg overflow-hidden shadow-sm border border-gray-100 dark:border-gray-800">
<div class="relative h-24 w-full">
<img alt="Salad rau củ quả" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBz1ed3VZGFvTqaBlQ160ssJIYwLBhagnm9nKbWX85Lxnhj5ybBH2p_ipM82hIqueIY7J3FIKSxdLcpdzUkwdV_2f3fCXlvMKzrPeE-qdYmR7uCnnOwMKMeai5q4SOpy-v4Poge2h2ANUVekU9Z61cGUbUisskNmNkoehbedXz9JchzIhLnJt-wlDCQmcSMJmtqhGo99Rcnt8uORdFEtkp4wUbOcxOjWxBR0FHRn1wP2hYXPy20J1MHZs0PI5wwJZ3DucnacQyHCg"/>
<div class="absolute bottom-1.5 right-1.5">
<span class="bg-black/60 backdrop-blur-md text-white text-[8px] font-bold px-1 py-0.5 rounded uppercase flex items-center gap-0.5">
<span class="material-symbols-outlined text-[10px]">timer</span> 10'
                        </span>
</div>
</div>
<div class="p-2">
<h4 class="text-[11px] font-bold text-[#111813] dark:text-white mb-1 truncate leading-tight">Salad cầu vồng</h4>
<button class="w-full bg-primary/10 text-primary dark:bg-primary/20 text-[10px] font-bold py-1.5 rounded flex items-center justify-center">
                        Xem chi tiết
                    </button>
</div>
</div>
</div>
</section>
</main>
<button class="fixed bottom-24 right-4 size-10 bg-primary text-black rounded-full shadow-lg shadow-primary/30 flex items-center justify-center active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined text-xl font-bold">add</span>
</button>
<nav class="shrink-0 bg-white/95 dark:bg-background-dark/95 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800 pb-6 pt-2 z-50">
<div class="flex justify-around items-center max-w-md mx-auto">
<button class="flex flex-col items-center gap-0.5 text-primary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="text-[10px] font-bold">Tủ lạnh</span>
</button>
<button class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-2xl">shopping_cart</span>
<span class="text-[10px] font-medium">Mua sắm</span>
</button>
<button class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-2xl">menu_book</span>
<span class="text-[10px] font-medium">Công thức</span>
</button>
<button class="flex flex-col items-center gap-0.5 text-gray-400 dark:text-gray-500">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-[10px] font-medium">Cá nhân</span>
</button>
</div>
</nav>

</body></html>
